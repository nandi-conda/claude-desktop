name: Publish claude-desktop

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and upload even if this version is already on prefix.dev
        type: boolean
        default: false

env:
  CHANNEL: nandi-testing

jobs:
  # Fail in seconds on a missing or rejected PREFIX_API_KEY instead of after the build.
  check-auth:
    runs-on: depot-ubuntu-latest
    steps:
      - name: Check prefix.dev API key
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          if [ -z "$PREFIX_API_KEY" ]; then
            echo "::error::PREFIX_API_KEY is empty or not available to this workflow"
            exit 1
          fi
          status=$(curl -sS -o viewer.json -w '%{http_code}' https://prefix.dev/api/graphql \
            -H "Authorization: Bearer $PREFIX_API_KEY" -H 'Content-Type: application/json' \
            --data '{"query": "{ viewer { login } }"}')
          login=$(jq -r '.data.viewer.login // empty' viewer.json 2>/dev/null || true)
          if [ "$status" != 200 ] || [ -z "$login" ]; then
            echo "::error::prefix.dev rejected PREFIX_API_KEY (HTTP $status). Regenerate a read/write key with upload access to $CHANNEL."
            cat viewer.json; echo
            exit 1
          fi
          echo "PREFIX_API_KEY authenticates as $login"

  build:
    needs: check-auth
    runs-on: depot-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            subdir: linux-64
          - arch: arm64
            subdir: linux-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest release
        id: release
        run: |
          set -o pipefail
          python3 scripts/resolve_release.py ${{ matrix.arch }} | tee -a "$GITHUB_OUTPUT"

      - name: Check prefix.dev for this version
        id: check
        run: |
          exists=false
          build=$(sed -n 's/^  number: *//p' recipe/recipe.yaml)
          if curl -fsSL "https://repo.prefix.dev/$CHANNEL/${{ matrix.subdir }}/repodata.json" -o repodata.json \
            && jq -e --arg v "${{ steps.release.outputs.version }}" --argjson b "$build" \
              '[(.packages // {}), (.["packages.conda"] // {})] | add | to_entries
               | any(.value.name == "claude-desktop" and .value.version == $v and .value.build_number == $b)' repodata.json >/dev/null; then
            exists=true
          fi
          [ "${{ inputs.force }}" = "true" ] && exists=false
          echo "exists=$exists" | tee -a "$GITHUB_OUTPUT"

      - name: Install rattler-build
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/rattler-build" \
            https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl
          chmod +x "$HOME/.local/bin/rattler-build"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          rattler-build --version

      - name: Build
        if: steps.check.outputs.exists == 'false'
        env:
          CD_VERSION: ${{ steps.release.outputs.version }}
          CD_URL: ${{ steps.release.outputs.url }}
          CD_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          rattler-build build --recipe recipe/recipe.yaml \
            --target-platform ${{ matrix.subdir }} --output-dir output

      # Kept as an artifact so a failed upload can be retried with
      # "Re-run failed jobs" without rebuilding.
      - name: Save package
        if: steps.check.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: conda-${{ matrix.subdir }}
          path: output/${{ matrix.subdir }}/*.conda
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: depot-ubuntu-latest
    steps:
      - name: Fetch built packages
        uses: actions/download-artifact@v4
        with:
          pattern: conda-*
          path: dist
          merge-multiple: true

      - name: Upload to prefix.dev
        env:
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          shopt -s nullglob
          pkgs=(dist/*.conda)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "Nothing new to upload"
            exit 0
          fi
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/rattler-build" \
            https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-unknown-linux-musl
          chmod +x "$HOME/.local/bin/rattler-build"
          "$HOME/.local/bin/rattler-build" upload prefix --channel "$CHANNEL" "${pkgs[@]}"
